name: Tauri capture PoC

on:
  pull_request:
    paths: ['TauriPoC/**', '.github/workflows/tauri-poc.yml', 'CaptureRuntime/evidence.py']
  push:
    branches: ['codex/tauri-poc', 'codex/tauri-network-capture']
    paths: ['TauriPoC/**', '.github/workflows/tauri-poc.yml', 'CaptureRuntime/evidence.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: TauriPoC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: TauriPoC/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Windows process lifetimes
        if: runner.os == 'Windows'
        run: python scripts/probe-windows-launch.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: python -m pip install mitmproxy==12.2.3
      - name: Locate installed mitmdump
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          executable = shutil.which("mitmdump")
          if not executable:
              raise SystemExit("mitmdump 12.2.3 was not installed")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"CAPTURE_TEST_MITMDUMP={Path(executable).resolve()}\n")
          PY
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p capture-poc-core --all-targets --locked -- -D warnings
      - name: Probe Windows process lifetimes inside the Rust test Job
        if: runner.os == 'Windows'
        run: cargo test -p capture-poc-core --test network windows_launch_probe_runs_inside_rust_test_job --locked -- --exact --nocapture
      - run: npm run verify
      - name: Verify real mitmdump evidence
        run: python scripts/probe-network-engine.py
      - run: python scripts/package-android.py --channel development --cache "${{ runner.temp }}/android-dependency-cache" --output "${{ runner.temp }}/android-package"
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-poc-${{ matrix.os }}
          path: ${{ runner.temp }}/android-package/
          if-no-files-found: error
