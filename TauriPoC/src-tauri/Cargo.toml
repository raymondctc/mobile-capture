[package]
name = "mobile-capture-tauri-poc"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
capture-poc-core = { path = "../capture-core" }
serde = { version = "1", features = ["derive"] }

[lib]
name = "mobile_capture_tauri_poc"
crate-type = ["staticlib", "cdylib", "rlib"]
